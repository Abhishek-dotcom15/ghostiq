<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Target Local App</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 30px;
      width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #f0f6fc; text-align: center; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 8px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      box-sizing: border-box;
    }
    input:focus { border-color: #58a6ff; outline: none; }
    button {
      width: 100%;
      padding: 10px;
      background-color: #238636;
      color: white;
      border: 1px solid rgba(240,246,252,0.1);
      border-radius: 6px;
      font-weight: 600;
      margin-top: 18px;
      cursor: pointer;
    }
    button:hover { background-color: #2ea043; }
    .error-box {
      background: rgba(248,81,73,0.1);
      border: 1px solid rgba(248,81,73,0.2);
      color: #ff7b72;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      display: none;
    }
    .dashboard { display: none; }
    .item-card {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Accessibility Violations (Demonstration) -->
    <div style="text-align: center; margin-bottom: 15px;">
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=80&auto=format&fit=crop" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; display: inline-block;" />
      <!-- Missing ALT attribute on image -->
    </div>

    <!-- Login Form -->
    <div id="login-section">
      <h2>App Secure Login</h2>
      <div id="error-alert" class="error-box"></div>
      
      <form id="login-form">
        <label for="email">Email address</label>
        <input type="text" id="email" required placeholder="name@example.com">
        
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter password">
        
        <button type="submit" id="submit-btn">Sign In</button>
      </form>

      <!-- Accessibility Violations: Input with no label/placeholder and empty button -->
      <div style="border-top: 1px dashed #30363d; margin-top: 20px; padding-top: 15px; text-align: center;">
        <input type="text" id="quick-search" style="max-width: 200px;">
        <button id="icon-only-btn" style="background-color: transparent; border: none; width: 40px; margin: 10px auto; display: block; padding: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: #8b949e;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </div>
    </div>

    <!-- Target Dashboard area -->
    <div id="dashboard-section" class="dashboard">
      <h2>User Workspace</h2>
      <p style="font-size: 0.85rem; color: #8b949e; text-align: center;">Welcome back, Administrator</p>
      
      <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
        <button id="slow-btn" style="background-color: #1f6feb;">Fetch Microservices</button>
        <button id="broken-btn" style="background-color: #da3633;">Trigger DB Call</button>
        <button id="complete-btn" style="background-color: #8b5cf6;">End Test Flow</button>
      </div>

      <div id="status-box" style="margin-top: 15px; font-size: 0.8rem; text-align: center; color: #8b949e;"></div>
      <div id="items-list"></div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // Dynamic ID modifier for self-healing demonstration
    emailInput.addEventListener('input', () => {
      const btn = document.getElementById('submit-btn');
      if (btn) {
        btn.id = 'login-submit';
        console.log('[Target App] Submit button ID changed dynamically to login-submit.');
      }
    });
    const errorAlert = document.getElementById('error-alert');
    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    
    const slowBtn = document.getElementById('slow-btn');
    const brokenBtn = document.getElementById('broken-btn');
    const completeBtn = document.getElementById('complete-btn');
    const statusBox = document.getElementById('status-box');
    const itemsList = document.getElementById('items-list');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value,
            password: passwordInput.value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Unauthorized credentials');
        }

        // Switch panel view
        loginSection.style.display = 'none';
        dashboardSection.style.display = 'block';
      } catch (err) {
        errorAlert.innerText = err.message;
        errorAlert.style.display = 'block';
        console.error('Validation failure:', err.message);
      }
    });

    slowBtn.addEventListener('click', async () => {
      statusBox.innerText = 'Connecting to backend microservice... (Delayed)';
      itemsList.innerHTML = '';
      try {
        const res = await fetch('/api/slow-items');
        const data = await res.json();
        statusBox.innerText = 'Microservices loaded successfully.';
        itemsList.innerHTML = data.items.map(item => `
          <div class="item-card">
            <strong>${item.name}</strong> - <span>${item.status}</span>
          </div>
        `).join('');
      } catch (err) {
        statusBox.innerText = 'Connection degraded.';
      }
    });

    brokenBtn.addEventListener('click', async () => {
      statusBox.innerText = 'Initiating write to DB node...';
      try {
        const res = await fetch('/api/broken');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        statusBox.innerText = 'DB commit successful.';
      } catch (err) {
        statusBox.innerText = 'Error: ' + err.message;
        console.error('[Console Error Hook] DB Query failure:', err.message);
      }
    });

    completeBtn.addEventListener('click', () => {
      statusBox.innerHTML = '<span style="color:#2ea043; font-weight:700;">Workflow Completed Successfully. Ready.</span>';
    });
  </script>
</body>
</html>
